# Cloudflare Worker that serves The Appden media from R2.
name = "appden-storage"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "appden-media"

[vars]
FIREBASE_PROJECT_ID = "appdenski"
# Origins allowed to call the worker.
ALLOWED_ORIGINS = "http://127.0.0.1:4173,http://localhost:4173,https://appden--appdenski.europe-west4.hosted.app,https://appdenski.web.app,https://appdenski.firebaseapp.com,https://appdenski.tmst.es"
MAX_UPLOAD_MB = "60"

# Secret (never commit it) — set with:
#   npx wrangler secret put SIGNING_SECRET
